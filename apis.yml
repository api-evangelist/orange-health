aid: orange-health
name: Orange Health
description: >-
  Orange Health Labs is an Indian at-home diagnostics laboratory serving
  Bengaluru, Delhi, Gurgaon, Noida and Hyderabad, offering 60-minute home
  sample collection and test results within about six hours. Its Partner API
  (documented on Apiary as the "Partner API Public Order Flow") lets healthcare
  partners, employers and apps check location serviceability and slots, create
  home-collection, lab-drop-off and health-camp orders, track order status,
  reschedule, cancel and add on tests, and pull structured investigation-level
  test results. Order lifecycle transitions (order.created through
  order.completed / order.cancelled) are delivered as HMAC-SHA256 signed
  webhooks. Authentication is an api_key request header.
